name: Nix Branding Change

on:
  workflow_dispatch:

jobs:
  rebrand:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Nix Rebrand Script
        run: |
          chmod +x nix-rebrand.sh
          ./nix-rebrand.sh

      - name: Commit Changes
        run: |
          git config user.name "Nix Bot"
          git config user.email "bot@nixbrowser.in"
          git add .
          git commit -m "🔥 Branding: Brave → Nix Browser"
          git push
